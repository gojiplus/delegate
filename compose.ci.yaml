services:
  pg:
    image: postgres:17-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_PASSWORD: ci
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20
  ci:
    image: node:24
    working_dir: /src
    volumes:
      - .:/src:ro
    environment:
      TEST_PG_URL: postgres://postgres:ci@pg:5432/postgres
    depends_on:
      pg:
        condition: service_healthy
    command:
      ["sh", "-c", "cp -r /src /work && cd /work && rm -rf node_modules && npm ci && make ci"]
